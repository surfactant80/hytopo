[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hytopo"
version = "1.0.4"
description = "Hydrate topology analyzer: HOP classification, cage recognition, cage tracking, phase and nucleation analysis for molecular dynamics trajectories"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING"]
requires-python = ">=3.10"
authors = [
    { name = "HyTopo authors" },
]
keywords = [
    "hydrate",
    "clathrate",
    "molecular dynamics",
    "GROMACS",
    "cage",
    "topology",
    "nucleation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "MDAnalysis>=2.0",
    "numba>=0.56",
    "matplotlib>=3.5",
    "networkx>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
hytopo = "hytopo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hytopo*"]

[tool.setuptools.package-data]
hytopo = [
    "UPDATES.md",
    "ideal_crystal/*.pdb",
    "ideal_crystal/*.json",
]
